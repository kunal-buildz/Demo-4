<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" fill="none">
  <defs>
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142826" />
      <stop offset="60%" stop-color="#0c1a19" />
      <stop offset="100%" stop-color="#060f0e" />
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ece5d8" />
      <stop offset="100%" stop-color="#b8a896" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8975a" />
      <stop offset="100%" stop-color="#dcc594" />
    </linearGradient>
    <filter id="softLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Deep clinic suite background -->
  <rect width="700" height="500" fill="url(#suiteBg)" />

  <!-- Ambient soothing glow light -->
  <circle cx="550" cy="120" r="140" fill="#2a7f79" opacity="0.3" filter="url(#softLight)" />
  <circle cx="150" cy="380" r="160" fill="#b8975a" opacity="0.1" filter="url(#softLight)" />

  <!-- Architectural clinic wall panels -->
  <line x1="200" y1="0" x2="200" y2="500" stroke="#dfd8cb" stroke-width="1" opacity="0.1" />
  <line x1="420" y1="0" x2="420" y2="500" stroke="#dfd8cb" stroke-width="1" opacity="0.1" />
  <line x1="0" y1="360" x2="700" y2="360" stroke="#dfd8cb" stroke-width="1" opacity="0.08" />

  <!-- Modern Ergonomic Dental Chair (Stylized architectural perspective) -->
  <g transform="translate(180, 160)">
    <!-- Base column -->
    <path d="M 160 210 L 190 210 L 210 270 L 140 270 Z" fill="#233b38" />
    <ellipse cx="175" cy="270" rx="60" ry="12" fill="#142826" stroke="#b8975a" stroke-width="1" opacity="0.6" />

    <!-- Chair seat & leg support -->
    <path d="M 80 180 C 130 180 180 190 230 160 C 270 140 310 160 320 180 C 280 200 210 205 130 205 Z" fill="url(#chairGrad)" />
    <!-- Backrest contour -->
    <path d="M 60 140 C 50 100 80 80 110 90 L 140 180 L 80 180 Z" fill="url(#chairGrad)" />
    <rect x="75" y="70" width="36" height="24" rx="12" fill="#e2dad0" stroke="#b8975a" stroke-width="1" />

    <!-- Overhead surgical LED light fixture -->
    <path d="M 280 30 C 280 -20 220 -40 160 -40" stroke="#b8975a" stroke-width="3" fill="none" opacity="0.8" />
    <path d="M 160 -40 L 140 -20" stroke="#b8975a" stroke-width="2.5" fill="none" />
    <ellipse cx="130" cy="-10" rx="36" ry="12" fill="#2a7f79" stroke="#dcc594" stroke-width="1.5" />
    <!-- Light cone -->
    <polygon points="100,-5 160,-5 240,150 20,150" fill="#ffffff" opacity="0.07" />

    <!-- 3D Digital scanner / monitor arm -->
    <path d="M 290 190 L 320 130 L 300 90" stroke="#2a7f79" stroke-width="2.5" fill="none" />
    <rect x="250" y="70" width="60" height="42" rx="4" fill="#071211" stroke="#b8975a" stroke-width="1.2" />
    <rect x="254" y="74" width="52" height="34" rx="2" fill="#0c1a19" />
    <!-- 3D wave or scan on screen -->
    <path d="M 260 92 Q 275 80 290 92 T 300 90" stroke="#2a7f79" stroke-width="2" fill="none" />
    <circle cx="280" cy="91" r="2" fill="#dcc594" />
  </g>

  <!-- Floating Feature Card / Stat Badge -->
  <g transform="translate(60, 360)">
    <rect width="280" height="84" rx="8" fill="#0c1a19" fill-opacity="0.9" stroke="#b8975a" stroke-width="1" />
    <text x="20" y="32" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#b8975a" letter-spacing="1.5">GERMAN DIGITAL SUITE</text>
    <text x="20" y="54" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="600" fill="#ffffff">Pain-Free &amp; Sterile Protocol</text>
    <text x="20" y="70" font-family="'DM Sans', sans-serif" font-size="11" fill="#d9e5e3" opacity="0.75">Class-B Autoclave • 3D Intraoral Scanner</text>
  </g>
</svg>
