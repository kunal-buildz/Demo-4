<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <radialGradient id="docBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b3834" />
      <stop offset="65%" stop-color="#0c1a19" />
      <stop offset="100%" stop-color="#07100f" />
    </radialGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e8edea" />
      <stop offset="100%" stop-color="#cbd6d2" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#dfb799" />
      <stop offset="100%" stop-color="#be9372" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2521" />
      <stop offset="100%" stop-color="#151210" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8975a" />
      <stop offset="100%" stop-color="#dcc594" />
    </linearGradient>
    <filter id="softGaze" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#docBg)" />
  
  <!-- Subtle architectural background curves -->
  <circle cx="500" cy="200" r="280" stroke="#2a7f79" stroke-width="1" opacity="0.15" fill="none" />
  <circle cx="500" cy="200" r="340" stroke="#b8975a" stroke-width="0.75" opacity="0.1" fill="none" />

  <!-- Doctor Silhouette & Professional Illustration -->
  <g filter="url(#softGaze)">
    <!-- Shoulders / Coat -->
    <path d="M120 750 C120 620 180 530 260 500 C275 495 325 495 340 500 C420 530 480 620 480 750 Z" fill="url(#coatGrad)" />
    <!-- Coat Lapels -->
    <path d="M260 500 L240 680 L290 750 L300 580 Z" fill="#d9e3e0" opacity="0.7" />
    <path d="M340 500 L360 680 L310 750 L300 580 Z" fill="#e2eae7" opacity="0.9" />
    <!-- Shirt & Medical Tie / Collar -->
    <polygon points="280,500 320,500 310,580 290,580" fill="#2a7f79" />
    <polygon points="292,540 308,540 304,680 296,680" fill="#142826" />
    <path d="M280 470 L300 515 L320 470 Z" fill="#ffffff" />
    
    <!-- Stethoscope subtle loop -->
    <path d="M245 520 C235 600 240 650 260 680 C270 695 285 700 290 700" stroke="#b8975a" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M355 520 C365 600 355 640 345 670" stroke="#b8975a" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="290" cy="700" r="10" fill="#b8975a" />
    <circle cx="290" cy="700" r="6" fill="#0c1a19" />

    <!-- Neck -->
    <rect x="278" y="420" width="44" height="65" rx="6" fill="url(#skinGrad)" />

    <!-- Head / Jawline -->
    <path d="M240 320 C240 230 360 230 360 320 C360 390 340 435 300 445 C260 435 240 390 240 320 Z" fill="url(#skinGrad)" />
    
    <!-- Hair -->
    <path d="M236 305 C235 240 265 200 300 198 C335 200 365 240 364 305 C350 280 340 265 300 265 C260 265 250 280 236 305 Z" fill="url(#hairGrad)" />
    <path d="M236 305 C234 330 240 350 244 360 C246 345 248 330 248 320 C248 300 240 305 236 305 Z" fill="url(#hairGrad)" />
    <path d="M364 305 C366 330 360 350 356 360 C354 345 352 330 352 320 C352 300 360 305 364 305 Z" fill="url(#hairGrad)" />

    <!-- Eyeballs, glasses or features silhouette (editorial stylized minimalism) -->
    <path d="M265 320 Q278 316 290 320" stroke="#2a2521" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M310 320 Q322 316 335 320" stroke="#2a2521" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M298 330 L303 355 L297 360" stroke="#a67c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Kind, confident smile -->
    <path d="M282 385 Q300 402 318 385" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M280 384 Q300 406 320 384" stroke="#8c4e40" stroke-width="1.8" fill="none" />

    <!-- Elegant rimless glasses frame -->
    <rect x="260" y="312" width="34" height="24" rx="5" stroke="#b8975a" stroke-width="1.2" fill="none" opacity="0.65" />
    <rect x="306" y="312" width="34" height="24" rx="5" stroke="#b8975a" stroke-width="1.2" fill="none" opacity="0.65" />
    <line x1="294" y1="322" x2="306" y2="322" stroke="#b8975a" stroke-width="1.2" opacity="0.65" />
  </g>

  <!-- Editorial Badge Overlay at bottom -->
  <g transform="translate(40, 660)">
    <rect width="520" height="60" rx="8" fill="#0c1a19" fill-opacity="0.88" stroke="#dfd8cb" stroke-opacity="0.25" />
    <text x="24" y="27" font-family="'Cormorant Garamond', Georgia, serif" font-size="19" font-weight="600" fill="#ffffff" letter-spacing="0.5">Dr. Demo Name</text>
    <text x="24" y="45" font-family="'DM Sans', sans-serif" font-size="11" font-weight="400" fill="#b8975a" letter-spacing="1.2">PRINCIPAL DENTAL SURGEON • 15+ YRS EXP</text>
    <circle cx="485" cy="30" r="14" fill="#2a7f79" />
    <path d="M480 30 L484 34 L492 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
